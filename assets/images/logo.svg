<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C45B" />
      <stop offset="50%" stop-color="#D9A52E" />
      <stop offset="100%" stop-color="#B8861B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Dark Background -->
  <circle cx="150" cy="150" r="142" fill="#080808" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="#D9A52E" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3" />

  <!-- Monogram / Wordmark BAS -->
  <text x="150" y="148" 
        font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
        font-size="64" 
        font-weight="700" 
        letter-spacing="6" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#subtleGlow)">
    BAS
  </text>

  <!-- Accent Divider -->
  <line x1="90" y1="168" x2="135" y2="168" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="150" cy="168" r="2.5" fill="#F2C45B" />
  <line x1="165" y1="168" x2="210" y2="168" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Subtitle SALON -->
  <text x="150" y="194" 
        font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="9" 
        fill="#FFFFFF" 
        text-anchor="middle"
        opacity="0.95">
    SALON
  </text>
  
  <!-- Est / Luxury Accent -->
  <text x="150" y="222" 
        font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#D9A52E" 
        text-anchor="middle"
        opacity="0.8">
    HAIR &bull; BEAUTY &bull; CRAFT
  </text>
</svg>
